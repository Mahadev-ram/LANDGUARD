<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#123b4a">LANDGUARD — PROVISIONAL WIRING DIAGRAM</text><text x="600" y="72" text-anchor="middle" font-family="Arial" font-size="15" fill="#a33">Confirm every pin against the assembled hardware before powering</text><rect x="430" y="220" width="340" height="300" rx="18" fill="#d9e8ee" stroke="#164b5a" stroke-width="3"/><text x="600" y="260" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">ESP32 DevKit</text><g font-family="Arial" font-size="18" fill="#123b4a"><text x="455" y="310">GPIO21 — SDA</text><text x="455" y="345">GPIO22 — SCL</text><text x="455" y="380">GPIO34 — Soil AO</text><text x="455" y="415">GPIO35 — Rain AO</text><text x="455" y="450">GPIO26 — LED</text><text x="455" y="485">GPIO25 — Buzzer</text></g><g fill="#f3f7f8" stroke="#26758a" stroke-width="2"><rect x="50" y="150" width="250" height="100" rx="10"/><rect x="50" y="300" width="250" height="100" rx="10"/><rect x="50" y="450" width="250" height="100" rx="10"/><rect x="880" y="150" width="250" height="100" rx="10"/><rect x="880" y="300" width="250" height="100" rx="10"/><rect x="880" y="450" width="250" height="100" rx="10"/></g><g font-family="Arial" font-size="18" text-anchor="middle" fill="#123b4a"><text x="175" y="190">SH1106 OLED</text><text x="175" y="220">SDA 21 / SCL 22</text><text x="175" y="340">MPU6050</text><text x="175" y="370">SDA 21 / SCL 22</text><text x="175" y="490">Soil moisture</text><text x="175" y="520">AO → GPIO34</text><text x="1005" y="190">Rain module</text><text x="1005" y="220">AO → GPIO35</text><text x="1005" y="340">LED + 220 Ω</text><text x="1005" y="370">GPIO26 → resistor → LED</text><text x="1005" y="490">Active buzzer</text><text x="1005" y="520">Signal → GPIO25</text></g><g stroke="#26758a" stroke-width="3" fill="none"><path d="M300 200 H360 V310 H430"/><path d="M300 350 H380 V345 H430"/><path d="M300 500 H390 V380 H430"/><path d="M770 415 H820 V200 H880"/><path d="M770 450 H830 V350 H880"/><path d="M770 485 H850 V500 H880"/></g><rect x="80" y="610" width="1040" height="90" rx="10" fill="#fff5df" stroke="#c58b2a" stroke-width="2"/><text x="100" y="640" font-family="Arial" font-size="17" font-weight="bold" fill="#7b5010">Power / ground notes</text><text x="100" y="668" font-family="Arial" font-size="16" fill="#7b5010">Common GND. Follow each module's voltage specification; ESP32 GPIO/ADC must never receive more than 3.3 V.</text><text x="100" y="690" font-family="Arial" font-size="16" fill="#7b5010">Vibration pinout is omitted because the exact connection was not confirmed.</text></svg>