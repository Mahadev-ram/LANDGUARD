<text x="195" y="170" font-size="21" font-weight="bold">SH1106 OLED</text><text x="195" y="201" font-size="17">SDA 21 · SCL 22</text><text x="195" y="226" font-size="17">Power per module</text>
<text x="195" y="328" font-size="21" font-weight="bold">MPU6050</text><text x="195" y="360" font-size="17">SDA 21 · SCL 22</text>
