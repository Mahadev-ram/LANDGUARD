<text x="80" y="642" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#80550d">Power and safety</text>
<text x="80" y="672" font-family="Arial,sans-serif" font-size="17" fill="#80550d">*Common GND. Follow each module's supply rating. ESP32 GPIO/ADC inputs must stay at or below 3.3 V.</text>
<text x="80" y="699" font-family="Arial,sans-serif" font-size="17" fill="#80550d">Use an LED series resistor. Add a transistor/driver if buzzer current exceeds safe GPIO limits.</text>
